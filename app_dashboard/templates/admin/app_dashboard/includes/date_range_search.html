{% load i18n %}
{% if cl.search_fields %}
<div id="toolbar">
  <form id="changelist-search" method="get" role="search">
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end;">
      {% for key, value in request.GET.items %}
        {% if key != 'q' and key != date_from_param and key != date_to_param and key != 'p' %}
          <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endif %}
      {% endfor %}
      <div style="display:flex; flex-direction:column; min-width:260px;">
        <label for="searchbar">{% trans "Search" %}</label>
        <input type="text" size="40" name="q" value="{{ cl.query }}" id="searchbar" autofocus>
      </div>
      <div style="display:flex; flex-direction:column;">
        <label for="id_{{ date_from_param }}">Từ ngày</label>
        <input id="id_{{ date_from_param }}" type="date" name="{{ date_from_param }}" value="{{ date_from }}">
      </div>
      <div style="display:flex; flex-direction:column;">
        <label for="id_{{ date_to_param }}">Đến ngày</label>
        <input id="id_{{ date_to_param }}" type="date" name="{{ date_to_param }}" value="{{ date_to }}">
      </div>
      <div style="display:flex; gap:6px; align-items:flex-end;">
        <input type="submit" value="{% trans 'Search' %}">
        <a class="button" href="?">Xóa bộ lọc</a>
      </div>
    </div>
  </form>
</div>
{% endif %}

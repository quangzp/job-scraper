{% load i18n %}
<div class="actions dashboard-delete-actions">
  {% for field in action_form %} {% if field.name == "action" %}
  <input type="hidden" name="action" value="delete_selected" />
  {% else %} {{ field }} {% endif %} {% endfor %}

  <div class="dashboard-delete-error" role="alert" hidden>
    {% translate "Select at least one item before deleting." %}
  </div>

  <button
    type="submit"
    class="button deletelink dashboard-delete-button"
    name="index"
    value="{{ action_index|default:0 }}"
    data-dashboard-delete-action="true"
  >
    {% translate "Delete" %}
  </button>
</div>
